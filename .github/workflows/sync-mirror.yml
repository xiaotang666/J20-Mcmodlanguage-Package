# 镜像同步：先把 Release 资产同步到镜像源，最后才同步 manifest.json
# （顺序要求：先资产后清单，避免模组拿到新清单却下载不到资产）
name: Sync Mirror

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  schedule:
    - cron: '0 20,21,22 * * *'   # UTC 20/21/22 点 = 北京时间 4/5/6 点
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mirror-staging
          gh release download --repo "$GITHUB_REPOSITORY" --dir mirror-staging --pattern '*.zip' --pattern 'manifest.json'

      # TODO: 接入实际镜像渠道（GitCode 仓库 / OSS / COS），上传 mirror-staging/ 下所有资产
      # - name: Upload to GitCode mirror
      #   run: ./tools/sync_gitcode.sh

      # - name: Upload to OSS
      #   uses: aliyun/oss-upload-action@v1
      #   with:
      #     ...
      - name: Placeholder notice
        run: |
          echo "镜像渠道尚未配置密钥；配置后在此处上传 mirror-staging/ 资产，"
          echo "并按 先资产后 manifest 的顺序更新镜像上的 manifest.json 副本。"

      - name: Verify mirror manifest consistency
        run: |
          # 镜像 manifest 必须与 GitHub manifest 内容一致；渠道接入后在此比对校验
          python -c "import json;m=json.load(open('mirror-staging/manifest.json'));assert m['latest']['packages'];print('manifest ok:', m['latest']['version'])"
